# Pulls Substack and Medium into src/content/snapshot.json (see scripts/sync/main.ts) and commits it when it
# changed, which redeploys the site. A source that fails keeps its last good data and turns the run red, and
# GitHub emails the failure. The weekly check fails if any feed is older than 14 days (scripts/sync/check.ts).
#
# Cost: about 1 to 2 minutes a run, 4 runs a day, so about 240 of the 2,000 free private-repo minutes a month.
name: Sync feeds

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
    - cron: "41 13 * * 1" # Mondays: staleness check only
  workflow_dispatch: # "Run workflow" button, for right after publishing

permissions:
  contents: write

concurrency:
  group: sync-feeds
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.schedule != '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync
        id: sync
        run: npm run sync
        continue-on-error: true
      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync feeds"
            git push
          fi
      - name: Fail the run if any source failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "At least one feed failed. Its last good data was kept. See the summary above."
          exit 1

  check:
    if: github.event.schedule == '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:feeds
